services:
  mysql:
    image: mysql:8.0.39
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set this in .env}
      MYSQL_DATABASE: porto
      MYSQL_USER: porto
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set this in .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: